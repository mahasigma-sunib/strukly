name: Secret Scan

on:
  push:
  pull_request:

env:
  BETTERLEAKS_VERSION: 1.9.0

jobs:

  betterleaks:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Cache betterleaks
      id: cache-betterleaks
      uses: actions/cache@v6
      with:
        path: ~/.betterleaks/bin
        key: betterleaks-${{ runner.os }}-${{ env.BETTERLEAKS_VERSION }}

    - name: Install betterleaks
      if: steps.cache-betterleaks.outputs.cache-hit != 'true'
      run: |
        base=https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}
        tarball=betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz
        curl -sSfLO "$base/$tarball"
        curl -sSfLO "$base/checksums.txt"
        sha256sum --check --ignore-missing checksums.txt
        mkdir -p ~/.betterleaks/bin
        tar -xzf "$tarball" -C ~/.betterleaks/bin betterleaks
        rm "$tarball" checksums.txt

    - name: Scan for secrets
      run: ~/.betterleaks/bin/betterleaks git . --confidence medium --redact --no-banner -v
