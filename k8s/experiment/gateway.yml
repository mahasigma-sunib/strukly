apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: koinku-gateway
  namespace: koinku-ns
spec:
  gatewayClassName: gke-l7-global-external-managed
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    hostname: "api2.koinku.my.id"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: koinku-httproute
  namespace: koinku-ns
spec:
  parentRefs:
  - name: koinku-gateway
  rules:
  - backendRefs:
    - name: koinku-service
      port: 3000
