apiVersion: apps/v1
kind: Deployment
metadata:
  name: koinku-deployment
  namespace: koinku-ns
  labels:
    app: koinku
spec:
  selector:
    matchLabels:
      app: koinku
  template:
    metadata:
      labels:
        app: koinku
    spec:
      nodeSelector:
        cloud.google.com/gke-spot: "true"

        # incurs node billing!
        # cloud.google.com/compute-class: "small-disk"
      terminationGracePeriodSeconds: 25
      containers:
      - name: koinku
        image: ghcr.io/mahasigma-sunib/koinku:latest
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
        envFrom:
        - secretRef:
            name: koinku-env
        env:
        - name: PRODUCTION
          value: "1"
