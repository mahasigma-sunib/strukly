apiVersion: apps/v1
kind: Deployment
metadata:
  name: koinku-deployment
  namespace: koinku-ns
  labels:
    app: koinku
spec:
  selector:
    matchLabels:
      app: koinku
  template:
    metadata:
      labels:
        app: koinku
    spec:
      nodeSelector:
        cloud.google.com/gke-spot: "true"

        # incurs node billing!
        # cloud.google.com/compute-class: "small-disk"
      terminationGracePeriodSeconds: 25
      initContainers:
      # prisma migrate deploy is a no-op when up to date and takes an advisory
      # lock, so running it on every pod start is safe.
      - name: migrate
        image: ghcr.io/mahasigma-sunib/koinku:migrator-latest
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
        envFrom:
        - secretRef:
            name: koinku-env
      containers:
      - name: koinku
        image: ghcr.io/mahasigma-sunib/koinku:latest
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
        envFrom:
        - secretRef:
            name: koinku-env
        env:
        - name: PRODUCTION
          value: "1"
        - name: GEMINI_MODEL
          value: "gemini-3.5-flash-lite"
        - name: OPENROUTER_MODEL
          value: "xiaomi/mimo-v2.6-flash"
