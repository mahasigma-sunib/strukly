apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: koinku-hpa
  namespace: koinku-ns
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: koinku-deployment
  minReplicas: 1
  maxReplicas: 2
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
