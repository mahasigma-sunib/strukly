apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: koinku-secrets-provider
  namespace: koinku-ns
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/408121045952/secrets/KOINKU_DATABASE_URL/versions/latest"
        path: "DATABASE_URL"
      - resourceName: "projects/408121045952/secrets/KOINKU_GEMINI_API_KEY/versions/latest"
        path: "GEMINI_API_KEY"
      - resourceName: "projects/408121045952/secrets/KOINKU_JWT_SECRET/versions/latest"
        path: "JWT_SECRET"
      - resourceName: "projects/408121045952/secrets/KOINKU_OPENROUTER_API_KEY/versions/latest"
        path: "OPENROUTER_API_KEY"
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: koinku-env
  namespace: koinku-ns
spec:
  serviceAccountName: koinku-sa
  secretProviderClassName: koinku-secrets-provider
  secretObject:
    type: Opaque
    data:
    - sourcePath: DATABASE_URL
      targetKey: DATABASE_URL
    - sourcePath: GEMINI_API_KEY
      targetKey: GEMINI_API_KEY
    - sourcePath: JWT_SECRET
      targetKey: JWT_SECRET
    - sourcePath: OPENROUTER_API_KEY
      targetKey: OPENROUTER_API_KEY
