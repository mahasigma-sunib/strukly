apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-deployment
  namespace: koinku-ns
  labels:
    app: cloudflared
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared
        args: ["tunnel", "--no-autoupdate", "run"]
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
        env:
        - name: TUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflared-env
              key: TUNNEL_TOKEN
