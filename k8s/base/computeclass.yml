# this would trigger node billing on autopilot

apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: small-disk
spec:
  nodePoolAutoCreation:
    enabled: true
  priorities:
  - machineFamily: e2
    spot: true
    storage:
      bootDiskType: pd-balanced
      bootDiskSize: 30
  - machineFamily: e2
    spot: false
    storage:
      bootDiskType: pd-balanced
      bootDiskSize: 30
  whenUnsatisfiable: DoNotScaleUp
