apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: cloudflared-secrets-provider
  namespace: koinku-ns
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/408121045952/secrets/KOINKU_CLOUDFLARED_TUNNEL_TOKEN/versions/latest"
        path: "TUNNEL_TOKEN"
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: cloudflared-env
  namespace: koinku-ns
spec:
  serviceAccountName: koinku-sa
  secretProviderClassName: cloudflared-secrets-provider
  secretObject:
    type: Opaque
    data:
    - sourcePath: TUNNEL_TOKEN
      targetKey: TUNNEL_TOKEN
